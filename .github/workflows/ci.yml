name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in `engines` and the first line that strips
        # TypeScript without a flag; 26 is what the fleet develops against.
        node-version: [22, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install npm 11.21.0
        run: |
          set -euo pipefail
          npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.21.0"

      - name: Install dependencies
        run: npm ci

      - name: Verify tracked pm project health
        shell: bash
        run: |
          set -euo pipefail
          # Catch durable checkout-visible failures: conflict markers, parse failures,
          # invalid or drifted history, tracked runtime caches, extension health,
          # stale in-progress work, and any merge evidence present in this clone.
          #
          # This is not a lossless-merge attestation. Merge receipts are clone-local and
          # absent from a fresh CI checkout. Some unreconciled loss shapes surface as
          # history drift, but reconciliation or history repair can remove that signal.
          # Keep receipt review as a local pre-push step; pm-cli#921 and pm-cli#922 track
          # the missing durable proof.
          #
          # `--strict-exit` is load-bearing: non-strict health may report findings while
          # still exiting successfully.
          ./node_modules/.bin/pm health --strict-exit --require-merge-drivers

      - name: npm release gate
        run: npm run release:check

      - name: Bun release gate
        run: bun run release:check

      - name: Verify private provenance runtime
        run: |
          npm ci --prefix .github/release-runtime --omit=dev --ignore-scripts --engine-strict --no-audit --no-fund
          node --test --test-concurrency=2 test/release-provenance.test.ts

      - name: Compatibility packed global, local and x consumers
        run: node test/compatibility-packed.acceptance.ts

      - name: Verify Bun can install the package graph
        run: bun install --no-save

  windows-consumers:
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install npm 11.21.0
        # Keep the selected Node installation on npm 11 even when a consumer
        # deliberately ignores the runner's user npm configuration.
        shell: bash
        run: |
          set -euo pipefail
          node_prefix="$(node -p 'require("node:path").dirname(process.execPath)')"
          npm install --global --prefix "$node_prefix" npm@11.21.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.21.0"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check consumer tooling
        id: build
        run: npm run build:test

      - name: Standalone pack fixture without npm_execpath
        run: |
          Remove-Item Env:npm_execpath -ErrorAction SilentlyContinue
          node --test test/pack-prepare.test.ts

      - name: Packed npm and native Bun consumers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          Remove-Item Env:npm_execpath -ErrorAction SilentlyContinue
          node test/packed-consumer.acceptance.ts
          node test/duplication-packed.acceptance.ts

      - name: Missing historical proof diagnostic
        run: node --test test/windows-proof-history.test.ts

      - name: Source-only revert proofs and actual npm 10 refusal
        run: node test/windows-consumers.proof.ts

  release-lock:
    name: Release lock compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.18.0, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install npm 11.21.0
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.21.0"
      - name: Install committed locks exactly as release tools do
        shell: bash
        run: |
          set -euo pipefail
          # Fresh directories ensure existing dependencies cannot hide a stale lock.
          for project in . .github/release-runtime; do
            scratch="$(mktemp -d)"
            cp "$project/package.json" "$project/package-lock.json" "$scratch/"
            (
              cd "$scratch"
              npm ci --omit=dev --ignore-scripts --legacy-peer-deps --no-audit --no-fund
            )
            rm -rf -- "$scratch"
          done
