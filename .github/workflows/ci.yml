name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Same PR grouping as the local-runner pilot (#254); manual runs stay independent.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    needs: [release-lock]
    if: ${{ always() }}
    # Required checks stay on fast GitHub-hosted hardware.
    runs-on: ubuntu-latest
    # Quick tier executes in about 6-7 min. A hung step must not hold a hosted slot for the default 6 h:
    # on 2026-11-15 three fleet release-gate jobs hung for 90+ min until another session cancelled them.
    timeout-minutes: 30
    env:
      PM_TEST_DEPTH: quick
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in `engines` and the first line that strips
        # TypeScript without a flag; 26 is what the fleet develops against.
        node-version: [22, 26]
    steps:
      - name: Require both release lock compatibility checks
        run: test '${{ needs.release-lock.result }}' = 'success'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Checkout must precede this first decision. NUL delimiters handle unusual
      # filenames; compare the actual PR endpoints, not the synthetic merge commit.
      # Disable rename folding so moving source into docs still counts its deletion.
      - name: Detect code changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          code=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            code=false
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                # Executable tracker files use the same code tier in every package.
                .agents/pm/*.mjs|.agents/pm/*.cjs|.agents/pm/*.js|.agents/pm/*.ts) code=true ;;
                .agents/pm/*|*.md|docs/*|CHANGELOG.md|LICENSE) ;;
                *) code=true ;;
              esac
            done < "$RUNNER_TEMP/ci-changed-paths"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install npm 11.21.0
        run: |
          set -euo pipefail
          npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.21.0"

      - name: Install dependencies
        run: npm ci

      - name: Verify tracked pm project health
        if: steps.changes.outputs.code != 'true' || matrix.node-version == 26
        shell: bash
        run: |
          set -euo pipefail
          # Catch durable checkout-visible failures: conflict markers, parse failures,
          # invalid or drifted history, tracked runtime caches, extension health,
          # stale in-progress work, and any merge evidence present in this clone.
          #
          # This is not a lossless-merge attestation. Merge receipts are clone-local and
          # absent from a fresh CI checkout. Some unreconciled loss shapes surface as
          # history drift, but reconciliation or history repair can remove that signal.
          # Keep receipt review as a local pre-push step; pm-cli#921 and pm-cli#922 track
          # the missing durable proof.
          #
          # `--strict-exit` is load-bearing: non-strict health may report findings while
          # still exiting successfully.
          ./node_modules/.bin/pm health --strict-exit --require-merge-drivers

      # No standalone markdown linter exists. These small suites enforce the
      # existing README/docs, shipped changelog and public commit contracts.
      - name: Check documentation and tracker changes
        if: steps.changes.outputs.code != 'true'
        run: |
          npm run changelog:check
          npm run verify:lifecycle-policy
          npm run verify:release-changelog-sections
          npm run verify:release-changelog-date
          npm run verify:release-publish-attestation
          npm run pack:dry-run
          node test/compatibility-packed.acceptance.ts
          node --test test/identity-audit.test.ts test/release-permissions-docs.test.ts test/release-verification.test.ts test/published-attestation.test.ts test/release-review.test.ts test/release-discovery-evidence.test.ts test/release-caller.test.ts
          node --test --test-name-pattern="caller template|migration.*guidance|rollback guidance|migration gap tracker" test/daily-release-workflow.test.ts

      - name: Engines floor tests
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 22
        run: npm test

      - name: Quick npm release gate
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: npm run release:check

      - name: Verify private provenance runtime
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: |
          npm ci --prefix .github/release-runtime --omit=dev --ignore-scripts --engine-strict --no-audit --no-fund
          node --test --test-concurrency=2 test/release-provenance.test.ts

      - name: Compatibility packed global, local and x consumers
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: node test/compatibility-packed.acceptance.ts

      # Compatibility acceptance proves npm/Bun local, global and npx/bunx paths.
      - name: Verify Bun can install the package graph
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: bun install --no-save

  windows-consumers:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PM_TEST_DEPTH: quick
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect code changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          code=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            code=false
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                # Executable tracker files use the same code tier in every package.
                .agents/pm/*.mjs|.agents/pm/*.cjs|.agents/pm/*.js|.agents/pm/*.ts) code=true ;;
                .agents/pm/*|*.md|docs/*|CHANGELOG.md|LICENSE) ;;
                *) code=true ;;
              esac
            done < "$RUNNER_TEMP/ci-changed-paths"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        if: steps.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install npm 11.21.0
        if: steps.changes.outputs.code == 'true'
        # Keep the selected Node installation on npm 11 even when a consumer
        # deliberately ignores the runner's user npm configuration.
        shell: bash
        run: |
          set -euo pipefail
          node_prefix="$(node -p 'require("node:path").dirname(process.execPath)')"
          npm install --global --prefix "$node_prefix" npm@11.21.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.21.0"

      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: npm ci --ignore-scripts

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: npm run build

      - name: Check consumer tooling
        if: steps.changes.outputs.code == 'true'
        id: build
        run: npm run build:test

      - name: Standalone pack fixture without npm_execpath
        if: steps.changes.outputs.code == 'true'
        run: |
          Remove-Item Env:npm_execpath -ErrorAction SilentlyContinue
          node --test test/pack-prepare.test.ts

      - name: Packed npm and native Bun consumers
        if: ${{ steps.changes.outputs.code == 'true' && !cancelled() && steps.build.outcome == 'success' }}
        run: |
          Remove-Item Env:npm_execpath -ErrorAction SilentlyContinue
          node test/packed-consumer.acceptance.ts
          node test/duplication-packed.acceptance.ts

      - name: Native Windows locked release runtime
        if: steps.changes.outputs.code == 'true'
        run: node --test --test-concurrency=2 test/release-runtime.test.ts test/release-runtime-windows.test.ts

      - name: Missing historical proof diagnostic
        if: steps.changes.outputs.code == 'true'
        run: node --test test/windows-proof-history.test.ts

      - name: Source-only revert proofs and actual npm 10 refusal
        if: steps.changes.outputs.code == 'true'
        run: node test/windows-consumers.proof.ts

  release-lock:
    name: Release lock compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PM_TEST_DEPTH: quick
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.18.0, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect code changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          code=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            code=false
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                # Executable tracker files use the same code tier in every package.
                .agents/pm/*.mjs|.agents/pm/*.cjs|.agents/pm/*.js|.agents/pm/*.ts) code=true ;;
                .agents/pm/*|*.md|docs/*|CHANGELOG.md|LICENSE) ;;
                *) code=true ;;
              esac
            done < "$RUNNER_TEMP/ci-changed-paths"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install npm 11.21.0
        if: steps.changes.outputs.code == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.21.0"
      - name: Install committed locks exactly as release tools do
        if: steps.changes.outputs.code == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Fresh directories ensure existing dependencies cannot hide a stale lock.
          for project in . .github/release-runtime; do
            scratch="$(mktemp -d)"
            cp "$project/package.json" "$project/package-lock.json" "$scratch/"
            (
              cd "$scratch"
              npm ci --omit=dev --ignore-scripts --legacy-peer-deps --no-audit --no-fund
            )
            rm -rf -- "$scratch"
          done
      - name: Check private runtime engines at the Node floor
        if: ${{ steps.changes.outputs.code == 'true' && matrix.node-version == '22.18.0' }}
        run: npm ci --prefix .github/release-runtime --omit=dev --ignore-scripts --legacy-peer-deps --engine-strict --no-audit --no-fund
      - name: Check root dependency engines at the Node floor
        if: ${{ steps.changes.outputs.code == 'true' && matrix.node-version == '22.18.0' }}
        run: npm ci --omit=dev --ignore-scripts --legacy-peer-deps --engine-strict --no-audit --no-fund
      - name: Check development dependency engines at the Node floor
        if: ${{ steps.changes.outputs.code == 'true' && matrix.node-version == '22.18.0' }}
        run: npm ci --include=dev --ignore-scripts --legacy-peer-deps --engine-strict --no-audit --no-fund
      - name: Test provenance at the Node floor
        if: ${{ steps.changes.outputs.code == 'true' && matrix.node-version == '22.18.0' }}
        run: |
          npm run build
          node --test --test-concurrency=2 test/release-provenance.test.ts
