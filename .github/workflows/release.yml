# Self-pilot: shared workflow at this trusted commit; fleet callers pin a released SHA.
name: Daily Release
on:
  schedule:
    - cron: 23 3 * * *
    - cron: 41 * * * *
  workflow_dispatch:
    inputs:
      retire-unpublished:
        description: Retire only owned untouched unpublished intent
        type: boolean
        default: false
permissions: {}
jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      id-token: write
      issues: write
    uses: ./.github/workflows/daily-release.yml
    with:
      # Keep this comparison in sync with the hourly cron above when staggering schedules.
      reconcile-only: ${{ (github.event_name == 'schedule' && github.event.schedule == '41 * * * *') || inputs.retire-unpublished == true }}
      retire-unpublished: ${{ github.event_name == 'workflow_dispatch' && inputs.retire-unpublished == true }}
      audit-script: release:audit
