# Self-pilot: shared workflow at this trusted commit; fleet callers pin a released SHA.
name: Daily Release
on:
  schedule:
    - cron: 23 3 * * *
    - cron: 41 * * * *
  workflow_dispatch: null
permissions: {}
jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      id-token: write
      issues: write
    uses: ./.github/workflows/daily-release.yml
    with:
      reconcile-only: ${{ github.event_name == 'schedule' && github.event.schedule == '41 * * * *' }}
      audit-script: release:audit
