# Durable release intent frees its runner before protected PR checks complete.
name: Reusable daily release
on:
  workflow_call:
    inputs:
      release-enabled:
        description: Approval gate; pass the existing repository variable comparison for unapproved packages
        type: boolean
        required: false
        default: true
      npm-project-dir:
        description: Relative npm project directory; Rust uses the crate root
        type: string
        required: false
        default: .
      node-version:
        description: Node runtime for release tools
        type: string
        required: false
        default: 22.18.0
      release-timezone:
        description: Calendar timezone for the single daily release
        type: string
        required: false
        default: Europe/Vienna
      rust:
        description: Use Cargo versioning and just release-check instead of npm project hooks
        type: boolean
        required: false
        default: false
      rust-toolchain:
        description: Rust stable toolchain including clippy and rustfmt
        type: string
        required: false
        default: 1.90.0
      rust-nightly:
        description: Rust coverage toolchain including llvm-tools-preview
        type: string
        required: false
        default: nightly-2026-08-06
      prepare-script:
        description: Optional npm script after version stamping, before the build
        type: string
        required: false
        default: ""
      build-script:
        description: npm build script; empty skips the build
        type: string
        required: false
        default: build
      verify-script:
        description: Required npm gate, run before commit and at merged main
        type: string
        required: false
        default: release:check
      changelog-script:
        description: pm-changelog generation npm script
        type: string
        required: false
        default: changelog:full
      changelog-check-script:
        description: pm-changelog verification npm script
        type: string
        required: false
        default: changelog:check
      notes-script:
        description: pm-changelog release notes npm script
        type: string
        required: false
        default: release:notes
      publish-script:
        description: Optional npm hook for extra publish targets, after npm and before tagging
        type: string
        required: false
        default: ""
      post-release-script:
        description: Optional npm hook after GitHub Release creation, e.g. upload self-host bundle
        type: string
        required: false
        default: ""
      audit-script:
        description: Optional npm completeness audit after release or recovery, including no-change runs
        type: string
        required: false
        default: ""
      release-files:
        description: Additional newline-separated repository-relative files to commit (no globs)
        type: string
        required: false
        default: ""
      npm-publish:
        description: Publish npm with OIDC; false for a GitHub-only crate release
        type: boolean
        required: false
        default: true
      bun-verify:
        description: Verify the published npm coordinate installs with Bun
        type: boolean
        required: false
        default: true
      bunx-script:
        description: Optional npm script for package-specific bunx acceptance after installation
        type: string
        required: false
        default: ""
      postgres:
        description: Provide the synthetic Postgres service required by pm-web release checks
        type: boolean
        required: false
        default: false
      alert-script:
        description: Optional npm script for failure reporting in a separate issues-write job
        type: string
        required: false
        default: ""
      version-policy:
        description: daily bumps the date automatically; package preserves a maintainer-reviewed package.json version
        type: string
        required: false
        default: daily
      reconcile-only:
        description: "Hourly recovery only: inspect durable intent without admitting a new release"
        type: boolean
        required: false
        default: false
      retire-unpublished:
        description: Explicit operator recovery of owned untouched unpublished intent
        type: boolean
        required: false
        default: false
permissions: {}
concurrency:
  group: daily-release
  cancel-in-progress: false
  queue: max
jobs:
  reconcile:
    if: inputs.release-enabled && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      actions: write
      checks: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_CONFIG: ${{ toJSON(inputs) }}
      CALLER_WORKFLOW: ${{ github.workflow_ref }}
      TRIGGER_SHA: ${{ github.sha }}
      RELEASE_TIMEZONE: ${{ inputs.release-timezone }}
      RETIRE_UNPUBLISHED: ${{ inputs.retire-unpublished }}
      NPM_PROJECT_DIR: ${{ inputs.npm-project-dir }}
      IS_RUST: ${{ inputs.rust }}
    outputs:
      action: ${{ steps.probe.outputs.action }}
      pending: ${{ steps.probe.outputs.pending }}
      receipt: ${{ steps.probe.outputs.receipt }}
      pr_number: ${{ steps.probe.outputs.pr_number }}
      merged_sha: ${{ steps.probe.outputs.merged_sha }}
      artifact_id: ${{ steps.probe.outputs.artifact_id }}
      schema: ${{ steps.probe.outputs.schema }}
      repository: ${{ steps.probe.outputs.repository }}
      defaultBranch: ${{ steps.probe.outputs.defaultBranch }}
      baseSha: ${{ steps.probe.outputs.baseSha }}
      headSha: ${{ steps.probe.outputs.headSha }}
      tree: ${{ steps.probe.outputs.tree }}
      version: ${{ steps.probe.outputs.version }}
      tag: ${{ steps.probe.outputs.tag }}
      packageName: ${{ steps.probe.outputs.packageName }}
      packageSha256: ${{ steps.probe.outputs.packageSha256 }}
      packageIntegrity: ${{ steps.probe.outputs.packageIntegrity }}
      notesSha256: ${{ steps.probe.outputs.notesSha256 }}
      cliVersion: ${{ steps.probe.outputs.cliVersion }}
      opsVersion: ${{ steps.probe.outputs.opsVersion }}
      tools_sha: ${{ steps.probe.outputs.tools_sha }}
      signer_workflow: ${{ steps.probe.outputs.signer_workflow }}
      runId: ${{ steps.probe.outputs.runId }}
      runAttempt: ${{ steps.probe.outputs.runAttempt }}
      workflow: ${{ steps.probe.outputs.workflow }}
      configDigest: ${{ steps.probe.outputs.configDigest }}
      npmPublish: ${{ steps.probe.outputs.npmPublish }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Checkout trusted continuation tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: unbraind/pm-ops
          ref: ${{ job.workflow_sha }}
          path: .pm-ops-release-tools
          persist-credentials: false
      - name: Locate trusted continuation tools
        shell: bash
        env:
          PUBLISHING_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          mv "$GITHUB_WORKSPACE/.pm-ops-release-tools" "$RUNNER_TEMP/pm-ops-release-tools"
          printf 'CONTINUATION_SCRIPT=%s/pm-ops-release-tools/scripts/release-continuation.ts\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PROVENANCE_SCRIPT=%s/pm-ops-release-tools/scripts/verify-registry-provenance.ts\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PUBLISHING_WORKFLOW_REF=%s\nPROVENANCE_SIGNER_WORKFLOW=%s\n' "$PUBLISHING_WORKFLOW_REF" "$PUBLISHING_WORKFLOW_REF" >> "$GITHUB_ENV"
      - name: Enforce continuation runtime floor
        shell: bash
        run: node "${CONTINUATION_SCRIPT%/scripts/*}/dist/continuation-runtime.js"
      - name: Reconcile durable release intent
        id: probe
        shell: bash
        run: node "$CONTINUATION_SCRIPT" probe
      - name: Approve currently waiting release CI once
        if: steps.probe.outputs.action == 'pending'
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.probe.outputs.headSha }}
          RELEASE_PR_NUMBER: ${{ steps.probe.outputs.pr_number }}
        run: |
          set -euo pipefail
          node "$CONTINUATION_SCRIPT" approve

  prepare:
    if: inputs.release-enabled && github.ref == 'refs/heads/main' && !inputs.reconcile-only && needs.reconcile.outputs.pending == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    services:
      postgres:
        image: ${{ inputs.postgres && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pmwebtest
        ports:
          - 55433:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      RELEASE_TIMEZONE: ${{ inputs.release-timezone }}
      NPM_PROJECT_DIR: ${{ inputs.npm-project-dir }}
      PREPARE_SCRIPT: ${{ inputs.prepare-script }}
      BUILD_SCRIPT: ${{ inputs.build-script }}
      VERIFY_SCRIPT: ${{ inputs.verify-script }}
      CHANGELOG_SCRIPT: ${{ inputs.changelog-script }}
      CHANGELOG_CHECK_SCRIPT: ${{ inputs.changelog-check-script }}
      NOTES_SCRIPT: ${{ inputs.notes-script }}
      PUBLISH_SCRIPT: ${{ inputs.publish-script }}
      POST_RELEASE_SCRIPT: ${{ inputs.post-release-script }}
      RELEASE_FILES: ${{ inputs.release-files }}
      BUNX_SCRIPT: ${{ inputs.bunx-script }}
      IS_RUST: ${{ inputs.rust }}
      DATABASE_URL: ${{ inputs.postgres && 'postgres://postgres:test@127.0.0.1:55433/pmwebtest' || '' }}
      JWT_SECRET: ${{ inputs.postgres && 'pm-web-test-jwt-secret-at-least-32-bytes' || '' }}
      VERSION_POLICY: ${{ inputs.version-policy }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_CONFIG: ${{ toJSON(inputs) }}
      CALLER_WORKFLOW: ${{ github.workflow_ref }}
      TRIGGER_SHA: ${{ github.sha }}
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      tag: ${{ steps.decide.outputs.tag }}
      npm_version: ${{ steps.decide.outputs.npm_version }}
      base_sha: ${{ steps.decide.outputs.base_sha }}
      release_branch: ${{ steps.decide.outputs.release_branch }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
      superseded_pr_numbers: ${{ steps.decide.outputs.superseded_pr_numbers }}
      commit: ${{ steps.pack.outputs.commit }}
      tree: ${{ steps.pack.outputs.tree }}
      package_sha256: ${{ steps.pack.outputs.package_sha256 }}
      recovery_tag: ${{ steps.decide.outputs.recovery_tag }}
      package_name: ${{ steps.pack.outputs.package_name }}
      cli_version: ${{ steps.pack.outputs.cli_version }}
      ops_version: ${{ steps.ops_version.outputs.version }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Use an npm that supports trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@11.21.0 --ignore-scripts --no-audit --no-fund
          active="$(npm --version)"
          [[ "$active" == "11.21.0" ]] || { echo "::error::Expected npm 11.21.0, got $active"; exit 1; }
          required="11.5.1"
          if [ "$(printf '%s\n%s\n' "$active" "$required" | sort -V | head -n 1)" != "$required" ]; then
            echo "::error::npm $active cannot exchange an OIDC token; $required or newer is required."
            exit 1
          fi
          echo "npm $active can exchange an OIDC token for a registry credential."
      - name: Resolve pm-ops release version
        shell: bash
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "${WORKFLOW_SHA}" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Cannot identify the reusable workflow commit from job.workflow_sha."; exit 1; }
          # The self-caller bootstraps the first release of this workflow from trusted main.
          if [[ "${GITHUB_REPOSITORY:-}" == unbraind/pm-ops ]]; then
            PM_OPS_VERSION="$(curl --fail --silent --show-error --max-time 30 "https://raw.githubusercontent.com/unbraind/pm-ops/$WORKFLOW_SHA/package.json" | node -p 'JSON.parse(require("node:fs").readFileSync(0,"utf8")).version')"
            [[ "$PM_OPS_VERSION" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]
            printf 'PM_OPS_VERSION=%s\n' "$PM_OPS_VERSION" >> "$GITHUB_ENV"
            printf 'version=%s\n' "$PM_OPS_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          remote_tags="$(git ls-remote --tags https://github.com/unbraind/pm-ops 'refs/tags/v*')" || { echo "::error::Cannot read pm-ops release tags; refusing an unverified install."; exit 1; }
          declare -A tag_commits=() peeled_commits=()
          while read -r sha ref; do
            [[ "${sha}" =~ ^[a-f0-9]{40}$ ]] || continue
            grep -zEq '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?(\^\{\})?$' < <(printf '%s\0' "${ref}") || continue
            if [[ "${ref}" == *'^{}' ]]; then
              declare "peeled_commits[${ref%'^{}'}]=${sha}"
            elif [[ "${ref}" == refs/tags/v* ]]; then
              declare "tag_commits[${ref}]=${sha}"
            fi
          done <<< "${remote_tags}"
          PM_OPS_VERSION=""
          for ref in "${!tag_commits[@]}"; do
            [[ "${peeled_commits[$ref]-${tag_commits[$ref]}}" == "${WORKFLOW_SHA}" ]] || continue
            candidate="$(VERSION="${ref#refs/tags/v}" node -e 'const [core, suffix] = process.env.VERSION.split("-"); process.stdout.write(core.split(".").map(Number).join(".") + (suffix === undefined ? "" : "-" + Number(suffix)))')"
            grep -zEq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$' < <(printf '%s\0' "${candidate}") || continue
            if [[ -n "${PM_OPS_VERSION}" && "${PM_OPS_VERSION}" != "${candidate}" ]]; then
              echo "::error::Multiple release versions tag this workflow commit; refusing an ambiguous install."
              exit 1
            fi
            PM_OPS_VERSION="${candidate}"
          done
          if [[ -z "${PM_OPS_VERSION}" ]]; then
            echo "::error::No release tag matches job.workflow_sha; pin a released pm-ops SHA."
            exit 1
          fi
          printf 'PM_OPS_VERSION=%s\n' "${PM_OPS_VERSION}" >> "$GITHUB_ENV"
          printf 'version=%s\n' "$PM_OPS_VERSION" >> "$GITHUB_OUTPUT"
        id: ops_version
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main
          persist-credentials: false
      - name: Checkout trusted continuation tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: unbraind/pm-ops
          ref: ${{ job.workflow_sha }}
          path: .pm-ops-release-tools
          persist-credentials: false
      - name: Locate trusted continuation tools
        shell: bash
        run: |
          set -euo pipefail
          mv "$GITHUB_WORKSPACE/.pm-ops-release-tools" "$RUNNER_TEMP/pm-ops-release-tools"
          printf 'CONTINUATION_SCRIPT=%s/pm-ops-release-tools/scripts/release-continuation.ts\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PROVENANCE_SCRIPT=%s/pm-ops-release-tools/scripts/verify-registry-provenance.ts\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Enforce continuation runtime floor
        shell: bash
        run: node "${CONTINUATION_SCRIPT%/scripts/*}/dist/continuation-runtime.js"
      - name: Install pinned release tools
        shell: bash
        run: node "$CONTINUATION_SCRIPT" tools
      - name: Refresh release base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          git checkout --detach origin/main
          [[ "$(git rev-parse HEAD)" == "$TRIGGER_SHA" ]] || { echo "::error::Default branch advanced; retry at its current head."; exit 1; }
        env:
          TRIGGER_SHA: ${{ github.sha }}
      - name: Validate package inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$NPM_PROJECT_DIR" && "$NPM_PROJECT_DIR" != /* && "$NPM_PROJECT_DIR" != *[$'\r\n:']* ]] || exit 1
          case "/$NPM_PROJECT_DIR/" in */../*) exit 1 ;; esac
          project="$(realpath -e -- "$GITHUB_WORKSPACE/$NPM_PROJECT_DIR")"
          [[ "$project" == "$GITHUB_WORKSPACE" || "$project" == "$GITHUB_WORKSPACE/"* ]] || exit 1
          [[ "$project" != *[$'\r\n:']* ]] || exit 1
          if [[ "$IS_RUST" == true ]]; then
            [[ -f "$project/Cargo.toml" ]]
          else
            [[ -f "$project/package.json" ]]
            [[ -n "$VERIFY_SCRIPT" && -n "$CHANGELOG_SCRIPT" && -n "$CHANGELOG_CHECK_SCRIPT" && -n "$NOTES_SCRIPT" ]]
          fi
          for script in "$PREPARE_SCRIPT" "$BUILD_SCRIPT" "$VERIFY_SCRIPT" "$CHANGELOG_SCRIPT" "$CHANGELOG_CHECK_SCRIPT" "$NOTES_SCRIPT" "$PUBLISH_SCRIPT" "$POST_RELEASE_SCRIPT" "$BUNX_SCRIPT"; do
            [[ -z "$script" || "$script" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.:-]*$ ]] || { echo '::error::Hooks must be npm script names.'; exit 1; }
          done
          printf 'NPM_PROJECT_PATH=%s\n' "$project" >> "$GITHUB_ENV"
          [[ "$VERSION_POLICY" == daily || "$VERSION_POLICY" == package ]]
          [[ "$VERSION_POLICY" != package || "$IS_RUST" != true ]]
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install Rust
        if: inputs.rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: clippy,rustfmt
      - name: Install Rust coverage
        if: inputs.rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ inputs.rust-nightly }}
          components: llvm-tools-preview
      - name: Install Rust gate tools
        if: inputs.rust
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b
        with:
          tool: just,cargo-llvm-cov,cargo-audit
      - name: Install dependencies
        if: "!inputs.rust"
        working-directory: ${{ env.NPM_PROJECT_PATH }}
        run: npm ci
      - name: Decide release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force --tags
          tags_file="$(mktemp "${RUNNER_TEMP}/release-tags.XXXXXX")"
          all_tags_file="$(mktemp "$RUNNER_TEMP/all-release-tags.XXXXXX")"
          git tag --merged HEAD --sort=-version:refname > "$all_tags_file"
          grep -E '^v[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(-[0-9]+)?$' "$all_tags_file" > "$tags_file" || [[ "$?" == 1 ]]
          rm -f -- "$all_tags_file"
          latest_tag="$(node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import {createRequire} from "node:module";
            const {latestReleaseTag}=createRequire(import.meta.url)(process.env.PM_OPS_MODULE);
            process.stdout.write(latestReleaseTag(readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean)));
          ' "$tags_file")"
          RELEASE_TODAY="$(TZ="$RELEASE_TIMEZONE" date +%Y.%m.%d)"
          export RELEASE_TODAY
          RELEASE_MAIN_SHA="$(git rev-parse HEAD)"
          export RELEASE_MAIN_SHA
          export RELEASE_LAST_TAG="$latest_tag"
          RELEASE_LAST_SHA=""
          export RELEASE_LAST_SHA
          export RELEASE_HAS_CHANGES=true
          export RELEASE_PACKAGE_VERSION=""
          export RELEASE_CURRENT_PACKAGE_VERSION=""
          export RELEASE_PUBLISHED_TODAY=false
          if [[ "$IS_RUST" != true && "$VERSION_POLICY" == daily ]]; then
            RELEASE_CURRENT_PACKAGE_VERSION="$(cd "$NPM_PROJECT_PATH" && npm pkg get version | tr -d '"')"
          fi
          if [[ "$VERSION_POLICY" == package ]]; then
            export RELEASE_PACKAGE_VERSION="$(cd "$NPM_PROJECT_PATH" && npm pkg get version | tr -d '"')"
            [[ "$RELEASE_PACKAGE_VERSION" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]
          fi
          # A resumed old date version still counts toward today's publication cap.
          published_file="$(mktemp "$RUNNER_TEMP/published-releases.XXXXXX")"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].published_at' > "$published_file"
          while IFS= read -r published; do
            if [[ "$(TZ="$RELEASE_TIMEZONE" date -d "$published" +%Y.%m.%d)" == "$RELEASE_TODAY" ]]; then export RELEASE_PUBLISHED_TODAY=true; fi
          done < "$published_file"
          rm -f -- "$published_file"

          if [[ -n "$latest_tag" ]]; then
            RELEASE_LAST_SHA="$(git rev-list -n 1 "$latest_tag")"
          export RELEASE_LAST_SHA
            if git diff --quiet "$latest_tag" HEAD -- .; then
              export RELEASE_HAS_CHANGES=false
            else
              diff_status=$?
              [[ "$diff_status" == 1 ]] || exit "$diff_status"
            fi
          fi
          release_prs_file="$(mktemp "${RUNNER_TEMP}/release-prs.XXXXXX")"
          trap 'rm -f -- "$release_prs_file" "$tags_file" || echo "::warning::Could not remove release planning files."' EXIT
          gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --limit 1000 \
            --json number,headRefName,isCrossRepository,author > "$release_prs_file"
          node --input-type=module - "$release_prs_file" "$tags_file" <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          import { createRequire } from 'node:module';
          const { decideDailyRelease } = createRequire(import.meta.url)(process.env.PM_OPS_MODULE);
          const e = process.env;
          const prs = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (prs.length >= 1000) throw new Error('PR candidate read may be truncated; refusing release');
          const plan = decideDailyRelease({
            existingPrs: prs, mainSha: e.RELEASE_MAIN_SHA, today: e.RELEASE_TODAY,
            packageVersion: e.RELEASE_PACKAGE_VERSION || undefined, publishedToday: e.RELEASE_PUBLISHED_TODAY === 'true',
            currentPackageVersion: e.RELEASE_CURRENT_PACKAGE_VERSION || undefined,
            hasChanges: e.RELEASE_HAS_CHANGES === 'true',
            releaseTags: readFileSync(process.argv[3], 'utf8').split('\n').filter(Boolean),
            lastRelease: e.RELEASE_LAST_TAG ? { tag: e.RELEASE_LAST_TAG, sha: e.RELEASE_LAST_SHA } : null,
          });
          for (const [key, value] of Object.entries(plan)) console.log(key + '=' + value);
          NODE
      - name: Generate recovery notes
        if: steps.decide.outputs.recovery_tag != ''
        working-directory: ${{ env.NPM_PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IS_RUST" == true ]]; then just release-notes > "$RUNNER_TEMP/recovery-notes.md"; else npm run --silent "$NOTES_SCRIPT" > "$RUNNER_TEMP/recovery-notes.md"; fi
          [[ -s "$RUNNER_TEMP/recovery-notes.md" ]]
      - name: Upload recovery notes
        if: steps.decide.outputs.recovery_tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: daily-release-recovery-notes
          path: ${{ runner.temp }}/recovery-notes.md
          if-no-files-found: error
          retention-days: 1
      - name: Check release ref
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Refusing to release from non-main ref ('$GITHUB_REF'). Run the release workflow from main."
            exit 1
          fi
      - name: Update release version
        if: steps.decide.outputs.should_release == 'true'
        working-directory: ${{ env.NPM_PROJECT_PATH }}
        env:
          NPM_VERSION: ${{ steps.decide.outputs.npm_version }}
          RELEASE_TAG: ${{ steps.decide.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IS_RUST" == true ]]; then
            node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs';
          const version = process.env.NPM_VERSION;
          import {createRequire} from 'node:module';
          const {stampCargoVersion} = createRequire(import.meta.url)(process.env.PM_OPS_MODULE);
          writeFileSync('Cargo.toml', stampCargoVersion(readFileSync('Cargo.toml', 'utf8'), version));
          const day = process.env.RELEASE_TAG.slice(1).split('.').map(Number);
          const date = day.map((n, i) => String(n).padStart(i === 0 ? 4 : 2, '0')).join('-');
          writeFileSync('justfile', readFileSync('justfile', 'utf8').replace(/^CHANGELOG_DATE := ".*"$/m, 'CHANGELOG_DATE := "' + date + '"'));
          NODE
            cargo update --workspace
          else
            if [[ "$VERSION_POLICY" == daily ]]; then npm version "$NPM_VERSION" --no-git-tag-version --allow-same-version --ignore-scripts; fi
            node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync, existsSync} from 'node:fs';
          import {createRequire} from 'node:module';
          const {stampExtensionVersion} = createRequire(import.meta.url)(process.env.PM_OPS_MODULE);
          const version = process.env.NPM_VERSION;
          if (existsSync('manifest.json')) {
            const manifest = JSON.parse(readFileSync('manifest.json', 'utf8'));
            manifest.version = version;
            writeFileSync('manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          }
          for (const file of ['index.ts', 'src/index.ts', 'src/extension.ts']) {
            if (existsSync(file)) writeFileSync(file, stampExtensionVersion(readFileSync(file, 'utf8'), version));
          }
          NODE
            if [[ -n "$PREPARE_SCRIPT" ]]; then npm run "$PREPARE_SCRIPT"; fi
            if [[ -n "$BUILD_SCRIPT" ]]; then
              rm -rf -- dist
              npm run "$BUILD_SCRIPT"
            fi
          fi
      - name: Generate changelog and release notes
        if: steps.decide.outputs.should_release == 'true'
        working-directory: ${{ env.NPM_PROJECT_PATH }}
        env:
          NPM_VERSION: ${{ steps.decide.outputs.npm_version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IS_RUST" == true ]]; then
            just changelog-full
            just changelog-check
            just release-notes > "$RUNNER_TEMP/RELEASE_NOTES.md"
          else
            # The tree-change decision already admitted this release. Dependency
            # and workflow changes still need notes without a closed tracker item.
            # Persist the same policy for nested release:check and post-tag checks.
            node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          let changed = false;
          for (const name of new Set([process.env.CHANGELOG_SCRIPT, process.env.CHANGELOG_CHECK_SCRIPT, process.env.NOTES_SCRIPT])) {
            const script = pkg.scripts?.[name];
            if (typeof script !== 'string' || !script.trim()) throw new Error(`Missing changelog hook: ${name}`);
            if (!/(?:^|\s)--include-empty(?:\s|$)/.test(script)) {
              pkg.scripts[name] = script + ' --include-empty';
              changed = true;
            }
          }
          if (changed) writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
            npm run "$CHANGELOG_SCRIPT" -- --include-empty
            npm run "$CHANGELOG_CHECK_SCRIPT" -- --include-empty
            npm run --silent "$NOTES_SCRIPT" -- --include-empty > "$RUNNER_TEMP/RELEASE_NOTES.md"
          fi
          [[ -s "$RUNNER_TEMP/RELEASE_NOTES.md" ]]
      - name: Record preparation stamp
        if: steps.decide.outputs.should_release == 'true'
        env:
          RELEASE_BASE_SHA: ${{ steps.decide.outputs.base_sha }}
          NPM_VERSION: ${{ steps.decide.outputs.npm_version }}
        shell: bash
        run: node "$CONTINUATION_SCRIPT" stamp
      - name: Run release checks
        if: steps.decide.outputs.should_release == 'true'
        working-directory: ${{ env.NPM_PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IS_RUST" == true ]]; then
            just release-check
          else
            npm run "$VERIFY_SCRIPT"
            node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const {verifyBunScript} = createRequire(import.meta.url)(process.env.PM_OPS_MODULE);
          verifyBunScript(process.env.VERIFY_SCRIPT);
          NODE
          fi
      - name: Commit release files
        if: steps.decide.outputs.should_release == 'true'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          RELEASE_TAG: ${{ steps.decide.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          paths=(.github/pm-release-candidate.json)
          project_prefix="$(realpath --relative-to="$GITHUB_WORKSPACE" "$NPM_PROJECT_PATH")"
          [[ "$project_prefix" == . ]] && project_prefix='' || project_prefix="$project_prefix/"
          while IFS= read -r -d '' path; do
            relative="${path#"$project_prefix"}"
            case "$relative" in package.json|package-lock.json|npm-shrinkwrap.json|manifest.json|CHANGELOG.md|index.ts|Cargo.toml|Cargo.lock|justfile|src/*|dist/*) paths+=("$path") ;; esac
          done < <(git ls-files --modified --deleted --others --exclude-standard -z -- "$NPM_PROJECT_DIR")
          if git ls-files --error-unmatch "${project_prefix}dist/" >/dev/null 2>&1; then paths+=("${project_prefix}dist/"); fi
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            [[ "$path" != /* && "$path" != -* && "$path" != *[$'\r\n']* ]]
            case "/$path/" in */../*|*/.git/*|*/.agents/pm/runtime/*) exit 1 ;; esac
            paths+=("$path")
          done <<< "$RELEASE_FILES"
          if [[ ${#paths[@]} -gt 0 ]]; then git add -- "${paths[@]}"; fi
          if ! git diff --cached --quiet; then git commit -m "Release $REPO_NAME $RELEASE_TAG"; fi
      - name: Pack verified release
        id: pack
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        env:
          BUN_VERIFY: ${{ inputs.npm-publish && inputs.bun-verify }}
        run: |
          set -euo pipefail
          # npm ci may refresh the local SDK merge-driver fence. It is not release metadata.
          if git ls-files --error-unmatch .gitattributes >/dev/null 2>&1; then
            git restore --source=HEAD --worktree -- .gitattributes
          fi
          git diff --exit-code -- .
          [[ -z "$(git status --porcelain=v1 --untracked-files=all -- "$NPM_PROJECT_PATH")" ]]
          handoff="$RUNNER_TEMP/release-artifact"
          mkdir -p "$handoff"
          if [[ "$IS_RUST" != true ]]; then
            cd "$NPM_PROJECT_PATH"
            if git ls-files --error-unmatch 'dist/' >/dev/null 2>&1; then
              [[ -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching -- dist/)" ]]
            fi
            cli_version=""
            if [[ "$BUN_VERIFY" == true ]]; then
              cli_version="$(node -p "require('./package.json').devDependencies?.['@unbrained/pm-cli'] || require(process.env.PM_OPS_TOOLS + '/node_modules/pm-ops/package.json').devDependencies['@unbrained/pm-cli']")"
              [[ "$cli_version" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]] || { echo '::error::@unbrained/pm-cli must be pinned to an exact version for Bun verification.'; exit 1; }
            fi
            npm pack --ignore-scripts --json --pack-destination "$handoff" > "$RUNNER_TEMP/pack.json"
            printf 'package_name=%s\n' "$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
            printf 'cli_version=%s\n' "$cli_version" >> "$GITHUB_OUTPUT"
            filename="$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'))[0].filename" "$RUNNER_TEMP/pack.json")"
            mv -- "$handoff/$filename" "$handoff/package.tgz"
            printf 'package_sha256=%s\n' "$(sha256sum "$handoff/package.tgz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          fi
          cd "$GITHUB_WORKSPACE"
          git branch verified-release HEAD
          git bundle create "$handoff/metadata.bundle" verified-release
          cp "$RUNNER_TEMP/RELEASE_NOTES.md" "$handoff/RELEASE_NOTES.md"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          printf 'handoff=%s\n' "$handoff" >> "$GITHUB_OUTPUT"
      - name: Record immutable release candidate
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        env:
          RELEASE_BASE_SHA: ${{ steps.decide.outputs.base_sha }}
          WORKFLOW_TOOLS_SHA: ${{ job.workflow_sha }}
          VERIFIED_COMMIT: ${{ steps.pack.outputs.commit }}
          VERIFIED_TREE: ${{ steps.pack.outputs.tree }}
          NPM_VERSION: ${{ steps.decide.outputs.npm_version }}
          RELEASE_TAG: ${{ steps.decide.outputs.tag }}
          PACKAGE_NAME: ${{ steps.pack.outputs.package_name }}
          CLI_VERSION: ${{ steps.pack.outputs.cli_version }}
          NPM_PUBLISH: ${{ inputs.npm-publish }}
        run: node "$CONTINUATION_SCRIPT" manifest
      - name: Upload verified release
        if: steps.decide.outputs.should_release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-daily-release-${{ steps.pack.outputs.commit }}
          path: ${{ steps.pack.outputs.handoff }}/
          if-no-files-found: error
          retention-days: 90
        id: upload
    needs: reconcile
  request:
    if: inputs.release-enabled && github.ref == 'refs/heads/main' && needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      RELEASE_TIMEZONE: ${{ inputs.release-timezone }}
      NPM_PROJECT_DIR: ${{ inputs.npm-project-dir }}
      PREPARE_SCRIPT: ${{ inputs.prepare-script }}
      BUILD_SCRIPT: ${{ inputs.build-script }}
      VERIFY_SCRIPT: ${{ inputs.verify-script }}
      CHANGELOG_SCRIPT: ${{ inputs.changelog-script }}
      CHANGELOG_CHECK_SCRIPT: ${{ inputs.changelog-check-script }}
      NOTES_SCRIPT: ${{ inputs.notes-script }}
      PUBLISH_SCRIPT: ${{ inputs.publish-script }}
      POST_RELEASE_SCRIPT: ${{ inputs.post-release-script }}
      RELEASE_FILES: ${{ inputs.release-files }}
      BUNX_SCRIPT: ${{ inputs.bunx-script }}
      IS_RUST: ${{ inputs.rust }}
      DATABASE_URL: ${{ inputs.postgres && 'postgres://postgres:test@127.0.0.1:55433/pmwebtest' || '' }}
      JWT_SECRET: ${{ inputs.postgres && 'pm-web-test-jwt-secret-at-least-32-bytes' || '' }}
      VERSION_POLICY: ${{ inputs.version-policy }}
      PM_OPS_VERSION: ${{ needs.prepare.outputs.ops_version }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_CONFIG: ${{ toJSON(inputs) }}
      CALLER_WORKFLOW: ${{ github.workflow_ref }}
      TRIGGER_SHA: ${{ github.sha }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Checkout publishing base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main
      - name: Checkout trusted continuation tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: unbraind/pm-ops
          ref: ${{ job.workflow_sha }}
          path: .pm-ops-release-tools
          persist-credentials: false
      - name: Locate trusted continuation tools
        shell: bash
        run: |
          set -euo pipefail
          mv "$GITHUB_WORKSPACE/.pm-ops-release-tools" "$RUNNER_TEMP/pm-ops-release-tools"
          printf 'CONTINUATION_SCRIPT=%s/pm-ops-release-tools/scripts/release-continuation.ts\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PROVENANCE_SCRIPT=%s/pm-ops-release-tools/scripts/verify-registry-provenance.ts\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Enforce continuation runtime floor
        shell: bash
        run: node "${CONTINUATION_SCRIPT%/scripts/*}/dist/continuation-runtime.js"
      - name: Download verified release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-daily-release-${{ needs.prepare.outputs.commit }}
          path: ${{ runner.temp }}/release-artifact
      - name: Verify artifact handoff
        shell: bash
        env:
          VERIFIED_COMMIT: ${{ needs.prepare.outputs.commit }}
          VERIFIED_TREE: ${{ needs.prepare.outputs.tree }}
          PACKAGE_SHA256: ${{ needs.prepare.outputs.package_sha256 }}
        run: |
          set -euo pipefail
          git bundle verify "$RUNNER_TEMP/release-artifact/metadata.bundle"
          git fetch "$RUNNER_TEMP/release-artifact/metadata.bundle" verified-release
          git checkout --detach FETCH_HEAD
          [[ "$(git rev-parse HEAD)" == "$VERIFIED_COMMIT" ]]
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$VERIFIED_TREE" ]]
          if [[ "$IS_RUST" != true ]]; then [[ "$(sha256sum "$RUNNER_TEMP/release-artifact/package.tgz" | cut -d' ' -f1)" == "$PACKAGE_SHA256" ]]; fi
      - name: Validate package inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$NPM_PROJECT_DIR" && "$NPM_PROJECT_DIR" != /* && "$NPM_PROJECT_DIR" != *[$'\r\n:']* ]] || exit 1
          case "/$NPM_PROJECT_DIR/" in */../*) exit 1 ;; esac
          project="$(realpath -e -- "$GITHUB_WORKSPACE/$NPM_PROJECT_DIR")"
          [[ "$project" == "$GITHUB_WORKSPACE" || "$project" == "$GITHUB_WORKSPACE/"* ]] || exit 1
          [[ "$project" != *[$'\r\n:']* ]] || exit 1
          if [[ "$IS_RUST" == true ]]; then
            [[ -f "$project/Cargo.toml" ]]
          else
            [[ -f "$project/package.json" ]]
            [[ -n "$VERIFY_SCRIPT" && -n "$CHANGELOG_SCRIPT" && -n "$CHANGELOG_CHECK_SCRIPT" && -n "$NOTES_SCRIPT" ]]
          fi
          for script in "$PREPARE_SCRIPT" "$BUILD_SCRIPT" "$VERIFY_SCRIPT" "$CHANGELOG_SCRIPT" "$CHANGELOG_CHECK_SCRIPT" "$NOTES_SCRIPT" "$PUBLISH_SCRIPT" "$POST_RELEASE_SCRIPT" "$BUNX_SCRIPT"; do
            [[ -z "$script" || "$script" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.:-]*$ ]] || { echo '::error::Hooks must be npm script names.'; exit 1; }
          done
          printf 'NPM_PROJECT_PATH=%s\n' "$project" >> "$GITHUB_ENV"
      - name: Verify npm will accept this workflow's OIDC identity
        if: needs.prepare.outputs.should_release == 'true' && inputs.npm-publish
        shell: bash
        env:
          CALLER_WORKFLOW: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          pkg_name="$(node -p "require('./package.json').name")"
          pkg_path="$(PKG="${pkg_name}" node -p "process.env.PKG.replace('/', '%2f')")"
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          request_token="${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          if [ -z "${request_url}" ] || [ -z "${request_token}" ]; then
            echo "::error::GitHub exposed no OIDC token endpoint to this job. The release job needs 'id-token: write'."
            exit 1
          fi
          if ! id_token_body="$(curl -sS --max-time 30 -H "Authorization: bearer ${request_token}" \
            "${request_url}&audience=npm:registry.npmjs.org")"; then
            echo "::error::Could not reach GitHub's OIDC token endpoint. Nothing was bumped, committed or tagged; re-run when it is reachable."
            exit 1
          fi
          id_token="$(printf '%s' "${id_token_body}" | node -p "JSON.parse(require('node:fs').readFileSync(0,'utf8')).value" 2>/dev/null)" || id_token=""
          if [ -z "${id_token}" ] || [ "${id_token}" = "undefined" ]; then
            echo "::error::GitHub would not mint an OIDC id-token. The release job needs 'id-token: write'."
            exit 1
          fi
          response="$(mktemp)"
          trap 'rm -f "${response}"' EXIT
          if ! status="$(curl -sS --max-time 30 -o "${response}" -w '%{http_code}' \
            -X POST "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${pkg_path}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${id_token}")"; then
            status="000"
          fi
          [ -n "${status}" ] || status="000"
          if [ "${status}" -ge 200 ] && [ "${status}" -lt 300 ]; then
            echo "npm accepted this workflow's identity for ${pkg_name}."
            echo "Note: this verifies identity, not the allowed action. The trusted publisher must have 'npm publish' selected."
            exit 0
          fi
          reason="$(RESPONSE_FILE="${response}" node -p "try{JSON.parse(require('node:fs').readFileSync(process.env.RESPONSE_FILE,'utf8')).message||''}catch(e){''}")"
          if [ "${status}" = "000" ] || [ "${status}" = "429" ] || [ "${status}" -ge 500 ]; then
            echo "::error::Could not reach npm to verify this workflow's identity for ${pkg_name} (HTTP ${status}${reason:+: ${reason}})."
            echo "::error::This is a registry or network failure, NOT a trusted-publisher problem. Nothing was bumped, committed or tagged; re-run when the registry is reachable."
            exit 1
          fi
          echo "::error::npm refused this workflow's OIDC identity for ${pkg_name} (HTTP ${status}${reason:+: ${reason}})."
          echo "::error::Nothing has been bumped, committed or tagged - this run stopped before mutating anything."
          echo "::error::Configure a trusted publisher on npmjs.com for ${pkg_name}: Settings -> Trusted Publisher -> GitHub Actions,"
          caller_workflow="${CALLER_WORKFLOW#*/.github/workflows/}"
          caller_workflow="${caller_workflow%@*}"
          echo "::error::organization '${GITHUB_REPOSITORY%/*}', repository '${GITHUB_REPOSITORY#*/}', workflow '${caller_workflow}', no environment."
          exit 1
        working-directory: ${{ env.NPM_PROJECT_PATH }}
      - name: Merge release metadata through protected PR
        if: needs.prepare.outputs.should_release == 'true'
        id: release_pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          NPM_VERSION: ${{ needs.prepare.outputs.npm_version }}
          RELEASE_BRANCH: ${{ needs.prepare.outputs.release_branch }}
          RELEASE_PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          REPO_NAME: ${{ github.event.repository.name }}
          ARTIFACT_ID: ${{ needs.prepare.outputs.artifact_id }}
        run: |
          set -euo pipefail
          git fetch origin main --force
          current_main_sha="$(git rev-parse origin/main)"
          if [[ "$current_main_sha" != "$RELEASE_BASE_SHA" ]]; then
            echo "::error::main advanced from ${RELEASE_BASE_SHA} to ${current_main_sha} while preparing the release. Retry from the new main head."
            exit 1
          fi

          release_commit="$(git rev-parse HEAD)"
          [[ "$release_commit" != "$current_main_sha" ]] || { echo "::error::Release metadata has no durable PR candidate; refusing implicit publication."; exit 1; }

          release_branch="$RELEASE_BRANCH"
          pr_number="$RELEASE_PR_NUMBER"
          remote_branch_sha="$(git ls-remote --heads origin "refs/heads/${release_branch}" | cut -f1)"
          if [[ -z "$pr_number" && -n "$remote_branch_sha" ]]; then
            RELEASE_BRANCH="$release_branch" REMOTE_BRANCH_SHA="$remote_branch_sha" node "$CONTINUATION_SCRIPT" retired-branch
          fi

          if [[ -n "$pr_number" ]]; then
            RELEASE_PR_NUMBER="$pr_number" REMOTE_BRANCH_SHA="$remote_branch_sha" node "$CONTINUATION_SCRIPT" ownership
            gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --disable-auto
            RELEASE_PR_NUMBER="$pr_number" REMOTE_BRANCH_SHA="$remote_branch_sha" node "$CONTINUATION_SCRIPT" ownership
          fi
          git push \
            --force-with-lease="refs/heads/${release_branch}:${remote_branch_sha}" \
            origin "HEAD:refs/heads/${release_branch}"
          if [[ -z "$pr_number" ]]; then
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$release_branch" \
              --title "Release ${REPO_NAME} ${RELEASE_TAG}" \
              --body "Automated daily release metadata for \`${RELEASE_TAG}\`. The release gate passed before this PR was created; npm publication and tagging remain blocked until this protected PR is merged.")"
            pr_number="${pr_url##*/}"
          else
            if ! edit_error="$(gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --title "Release ${REPO_NAME} ${RELEASE_TAG}" \
              --body "Automated daily release metadata for \`${RELEASE_TAG}\`, rebuilt from current main. The release gate passed before refresh; publication and tagging wait for the protected PR." 2>&1)"; then
              edit_error="${edit_error//$'\n'/ }"
              edit_error="${edit_error//$'\r'/ }"
              edit_error="${edit_error//%/%25}"
              echo "::warning::Could not refresh title/body of release PR #${pr_number}: ${edit_error}"
            fi
          fi

          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          pr_number="$pr_number"
          unresolved="$(gh api graphql \
              -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){reviewThreads(first:100){nodes{id isResolved comments(first:100){totalCount nodes{author{login __typename}}}}}}}}' \
              -F o="$owner" -F r="$repo" -F n="$pr_number" \
              --jq '.data.repository.pullRequest.reviewThreads.nodes[]?
                    | select(.isResolved==false)
                    | select(.comments.totalCount ==
                             ([.comments.nodes[]?] | length))
                    | select(.comments.nodes | length > 0)
                    | select(all(.comments.nodes[];
                        .author.__typename == "Bot" and
                        (.author.login | IN("sourcery-ai", "cubic-dev-ai", "coderabbitai"))))
                    | .id' 2>/dev/null || true)"
            if [[ -n "$unresolved" ]]; then
              while IFS= read -r thread_id; do
                [[ -z "$thread_id" ]] && continue
                gh api graphql \
                  -f query='mutation($t:ID!){resolveReviewThread(input:{threadId:$t}){thread{isResolved}}}' \
                  -F t="$thread_id" >/dev/null 2>&1 || true
              done <<< "$unresolved"
            fi

          RELEASE_PR_NUMBER="$pr_number" node "$CONTINUATION_SCRIPT" request
          printf 'pr_number=%s\n' "$pr_number" >> "$GITHUB_OUTPUT"
      - name: Close superseded release PRs
        if: needs.prepare.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_NUMBER: ${{ steps.release_pr.outputs.pr_number }}
          SUPERSEDED_PR_NUMBERS: ${{ needs.prepare.outputs.superseded_pr_numbers }}
        run: node "$CONTINUATION_SCRIPT" supersede
    needs: prepare
  release:
    if: inputs.release-enabled && github.ref == 'refs/heads/main' && contains(fromJSON('["publish","recover","complete"]'), needs.reconcile.outputs.action)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      issues: read
      id-token: write
    env:
      RELEASE_TIMEZONE: ${{ inputs.release-timezone }}
      NPM_PROJECT_DIR: ${{ inputs.npm-project-dir }}
      PREPARE_SCRIPT: ${{ inputs.prepare-script }}
      BUILD_SCRIPT: ${{ inputs.build-script }}
      VERIFY_SCRIPT: ${{ inputs.verify-script }}
      CHANGELOG_SCRIPT: ${{ inputs.changelog-script }}
      CHANGELOG_CHECK_SCRIPT: ${{ inputs.changelog-check-script }}
      NOTES_SCRIPT: ${{ inputs.notes-script }}
      PUBLISH_SCRIPT: ${{ inputs.publish-script }}
      POST_RELEASE_SCRIPT: ${{ inputs.post-release-script }}
      RELEASE_FILES: ${{ inputs.release-files }}
      BUNX_SCRIPT: ${{ inputs.bunx-script }}
      IS_RUST: ${{ inputs.rust }}
      DATABASE_URL: ${{ inputs.postgres && 'postgres://postgres:test@127.0.0.1:55433/pmwebtest' || '' }}
      JWT_SECRET: ${{ inputs.postgres && 'pm-web-test-jwt-secret-at-least-32-bytes' || '' }}
      VERSION_POLICY: ${{ inputs.version-policy }}
      PM_OPS_VERSION: ${{ needs.reconcile.outputs.opsVersion }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_CONFIG: ${{ toJSON(inputs) }}
      CALLER_WORKFLOW: ${{ github.workflow_ref }}
      TRIGGER_SHA: ${{ github.sha }}
      CANDIDATE_RECEIPT: ${{ needs.reconcile.outputs.receipt }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Use an npm that supports trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@11.21.0 --ignore-scripts --no-audit --no-fund
          active="$(npm --version)"
          [[ "$active" == "11.21.0" ]] || { echo "::error::Expected npm 11.21.0, got $active"; exit 1; }
          required="11.5.1"
          if [ "$(printf '%s\n%s\n' "$active" "$required" | sort -V | head -n 1)" != "$required" ]; then
            echo "::error::npm $active cannot exchange an OIDC token; $required or newer is required."
            exit 1
          fi
          echo "npm $active can exchange an OIDC token for a registry credential."
      - name: Checkout publishing base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main
      - name: Checkout trusted continuation tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: unbraind/pm-ops
          ref: ${{ job.workflow_sha }}
          path: .pm-ops-release-tools
          persist-credentials: false
      - name: Locate trusted continuation tools
        shell: bash
        env:
          PUBLISHING_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          mv "$GITHUB_WORKSPACE/.pm-ops-release-tools" "$RUNNER_TEMP/pm-ops-release-tools"
          printf 'CONTINUATION_SCRIPT=%s/pm-ops-release-tools/scripts/release-continuation.ts\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PROVENANCE_SCRIPT=%s/pm-ops-release-tools/scripts/verify-registry-provenance.ts\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PUBLISHING_WORKFLOW_REF=%s\nPROVENANCE_SIGNER_WORKFLOW=%s\n' "$PUBLISHING_WORKFLOW_REF" "$PUBLISHING_WORKFLOW_REF" >> "$GITHUB_ENV"
      - name: Enforce continuation runtime floor
        shell: bash
        run: node "${CONTINUATION_SCRIPT%/scripts/*}/dist/continuation-runtime.js"
      - name: Checkout recorded release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: unbraind/pm-ops
          ref: ${{ needs.reconcile.outputs.tools_sha }}
          path: .pm-ops-recorded-tools
          persist-credentials: false
      - name: Locate recorded release tools
        shell: bash
        run: |
          set -euo pipefail
          mv "$GITHUB_WORKSPACE/.pm-ops-recorded-tools" "$RUNNER_TEMP/pm-ops-recorded-tools"
          printf 'RELEASE_TOOLS_ROOT=%s/pm-ops-recorded-tools\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned release tools
        shell: bash
        run: node "$CONTINUATION_SCRIPT" tools
      - name: Download verified release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.reconcile.outputs.artifact_id }}
          run-id: ${{ needs.reconcile.outputs.runId }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-artifact
          merge-multiple: true
      - name: Revalidate trusted merged candidate
        id: continue
        shell: bash
        run: node "$CONTINUATION_SCRIPT" verify
      - name: Verify merged release
        shell: bash
        env:
          MERGED_SHA: ${{ needs.reconcile.outputs.merged_sha }}
          VERIFIED_TREE: ${{ needs.reconcile.outputs.tree }}
        run: |
          set -euo pipefail
          git fetch origin main --force
          git checkout --detach "$MERGED_SHA"
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$VERIFIED_TREE" ]]
      - name: Validate package inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$NPM_PROJECT_DIR" && "$NPM_PROJECT_DIR" != /* && "$NPM_PROJECT_DIR" != *[$'\r\n:']* ]] || exit 1
          case "/$NPM_PROJECT_DIR/" in */../*) exit 1 ;; esac
          project="$(realpath -e -- "$GITHUB_WORKSPACE/$NPM_PROJECT_DIR")"
          [[ "$project" == "$GITHUB_WORKSPACE" || "$project" == "$GITHUB_WORKSPACE/"* ]] || exit 1
          [[ "$project" != *[$'\r\n:']* ]] || exit 1
          if [[ "$IS_RUST" == true ]]; then
            [[ -f "$project/Cargo.toml" ]]
          else
            [[ -f "$project/package.json" ]]
            [[ -n "$VERIFY_SCRIPT" && -n "$CHANGELOG_SCRIPT" && -n "$CHANGELOG_CHECK_SCRIPT" && -n "$NOTES_SCRIPT" ]]
          fi
          for script in "$PREPARE_SCRIPT" "$BUILD_SCRIPT" "$VERIFY_SCRIPT" "$CHANGELOG_SCRIPT" "$CHANGELOG_CHECK_SCRIPT" "$NOTES_SCRIPT" "$PUBLISH_SCRIPT" "$POST_RELEASE_SCRIPT" "$BUNX_SCRIPT"; do
            [[ -z "$script" || "$script" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.:-]*$ ]] || { echo '::error::Hooks must be npm script names.'; exit 1; }
          done
          printf 'NPM_PROJECT_PATH=%s\n' "$project" >> "$GITHUB_ENV"
      - name: Verify npm will accept this workflow's OIDC identity
        if: steps.continue.outputs.action == 'publish' && inputs.npm-publish
        shell: bash
        env:
          CALLER_WORKFLOW: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          pkg_name="$(node -p "require('./package.json').name")"
          pkg_path="$(PKG="${pkg_name}" node -p "process.env.PKG.replace('/', '%2f')")"
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          request_token="${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          if [ -z "${request_url}" ] || [ -z "${request_token}" ]; then
            echo "::error::GitHub exposed no OIDC token endpoint to this job. The release job needs 'id-token: write'."
            exit 1
          fi
          if ! id_token_body="$(curl -sS --max-time 30 -H "Authorization: bearer ${request_token}" \
            "${request_url}&audience=npm:registry.npmjs.org")"; then
            echo "::error::Could not reach GitHub's OIDC token endpoint. Nothing was bumped, committed or tagged; re-run when it is reachable."
            exit 1
          fi
          id_token="$(printf '%s' "${id_token_body}" | node -p "JSON.parse(require('node:fs').readFileSync(0,'utf8')).value" 2>/dev/null)" || id_token=""
          if [ -z "${id_token}" ] || [ "${id_token}" = "undefined" ]; then
            echo "::error::GitHub would not mint an OIDC id-token. The release job needs 'id-token: write'."
            exit 1
          fi
          response="$(mktemp)"
          trap 'rm -f "${response}"' EXIT
          if ! status="$(curl -sS --max-time 30 -o "${response}" -w '%{http_code}' \
            -X POST "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${pkg_path}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${id_token}")"; then
            status="000"
          fi
          [ -n "${status}" ] || status="000"
          if [ "${status}" -ge 200 ] && [ "${status}" -lt 300 ]; then
            echo "npm accepted this workflow's identity for ${pkg_name}."
            echo "Note: this verifies identity, not the allowed action. The trusted publisher must have 'npm publish' selected."
            exit 0
          fi
          reason="$(RESPONSE_FILE="${response}" node -p "try{JSON.parse(require('node:fs').readFileSync(process.env.RESPONSE_FILE,'utf8')).message||''}catch(e){''}")"
          if [ "${status}" = "000" ] || [ "${status}" = "429" ] || [ "${status}" -ge 500 ]; then
            echo "::error::Could not reach npm to verify this workflow's identity for ${pkg_name} (HTTP ${status}${reason:+: ${reason}})."
            echo "::error::This is a registry or network failure, NOT a trusted-publisher problem. Nothing was bumped, committed or tagged; re-run when the registry is reachable."
            exit 1
          fi
          echo "::error::npm refused this workflow's OIDC identity for ${pkg_name} (HTTP ${status}${reason:+: ${reason}})."
          echo "::error::Nothing has been bumped, committed or tagged - this run stopped before mutating anything."
          echo "::error::Configure a trusted publisher on npmjs.com for ${pkg_name}: Settings -> Trusted Publisher -> GitHub Actions,"
          caller_workflow="${CALLER_WORKFLOW#*/.github/workflows/}"
          caller_workflow="${caller_workflow%@*}"
          echo "::error::organization '${GITHUB_REPOSITORY%/*}', repository '${GITHUB_REPOSITORY#*/}', workflow '${caller_workflow}', no environment."
          exit 1
        working-directory: ${{ env.NPM_PROJECT_PATH }}
      - name: Publish npm package
        id: publish
        if: steps.continue.outputs.action != 'complete' && inputs.npm-publish
        shell: bash
        env:
          NPM_VERSION: ${{ needs.reconcile.outputs.version }}
          PROVENANCE_SIGNER_WORKFLOW: ${{ steps.continue.outputs.signer_workflow }}
        run: |
          set -euo pipefail
          globalconfig="$(npm config get globalconfig 2>/dev/null || true)"
          for userconfig in "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" "${globalconfig}"; do
          if [ -n "$userconfig" ] && [ -f "$userconfig" ]; then
            sed -i'' -e '/_authToken/d' \
              -e '/^[[:space:]]*_auth[[:space:]]*=/d' -e '/:_auth[[:space:]]*=/d' \
              -e '/^[[:space:]]*username[[:space:]]*=/d' -e '/:username[[:space:]]*=/d' \
              -e '/^[[:space:]]*_password[[:space:]]*=/d' -e '/:_password[[:space:]]*=/d' \
              -e '/^[[:space:]]*certfile[[:space:]]*=/d' -e '/:certfile[[:space:]]*=/d' \
              -e '/^[[:space:]]*keyfile[[:space:]]*=/d' -e '/:keyfile[[:space:]]*=/d' \
              -e '/always-auth/d' "$userconfig"
          fi
          done
          active_npm="$(npm --version)"
          required_npm="11.5.1"
          if [ "$(printf '%s\n%s\n' "$active_npm" "$required_npm" | sort -V | head -n 1)" != "$required_npm" ]; then
            echo "::error::npm $active_npm resolved at publish time cannot exchange an OIDC token; $required_npm or newer is required."
            exit 1
          fi
          pkg_name="$(node -p "require('./package.json').name")"
          expected_integrity="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/release-artifact/package.tgz" | base64 -w0)"
          registry_version_is_attested() {
            local metadata attest_url
            metadata="$(npm view "${pkg_name}@${NPM_VERSION}" dist --prefer-online --json 2>/dev/null)" || return 2
            [[ "$(jq -r '.integrity // empty' <<< "$metadata")" == "$expected_integrity" ]] || return 1
            attest_url="$(jq -r '.attestations.url // empty' <<< "$metadata")"
            [[ "$attest_url" == https://registry.npmjs.org/* ]] || return 1
            curl --fail --silent --show-error --max-time 30 "$attest_url" | \
              EXPECTED_INTEGRITY="$(jq -r '.integrity' <<< "$metadata")" EXPECTED_COMMIT="$(git rev-parse HEAD)" \
              node "$PROVENANCE_SCRIPT"
          }

          registry_has_version() {
            npm view "${pkg_name}@${NPM_VERSION}" version --prefer-online --json >/dev/null 2>&1
          }
          reconciled_attested() {
            registry_has_version && registry_version_is_attested
          }
          max_attempts=3
          refuse_unattested_or_fail() {
            if registry_has_version; then
              local attestation_status=0
              registry_version_is_attested || attestation_status=$?
              if (( attestation_status == 2 )); then
                echo "::error::Could not read attestation metadata for ${pkg_name}@${NPM_VERSION}. This is a registry read failure, NOT proof that the artifact is unattested. Refusing to tag and release on unverified provenance; retry when the registry answers."
                exit 1
              fi
              echo "::error::${pkg_name}@${NPM_VERSION} exists on the registry without matching commit and artifact provenance. This workflow only ever publishes with --provenance, so either that artifact did not come from this job, or its attestation never became visible. Refusing to tag and release around it; investigate before re-running."
            else
              echo "::error::npm did not confirm ${pkg_name}@${NPM_VERSION} is published after ${max_attempts} publish attempts and a 10-minute visibility window. The registry shows nothing at that coordinate right now: either the publish genuinely failed, or propagation outlasted the window. Refusing to downgrade supply-chain attestations; retry the release transaction."
            fi
            exit 1
          }

          if reconciled_attested; then
            echo "::notice::${pkg_name}@${NPM_VERSION} already published and attested; skipping publish step."
            exit 0
          fi
          publish_with_provenance() {
            (
              cd "$RUNNER_TEMP"
              npm publish ./release-artifact/package.tgz --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org
            )
          }
          node "$CONTINUATION_SCRIPT" attempt
          attempt=0
          while (( attempt < max_attempts )); do
            attempt=$(( attempt + 1 ))
            if publish_with_provenance; then
              echo "Publish accepted on attempt ${attempt}; verifying registry provenance."
              break
            fi
            if reconciled_attested; then
              echo "::notice::Version landed attested despite the reported error; treating as success."
              exit 0
            fi
            if (( attempt < max_attempts )); then
              echo "Publish attempt ${attempt}/${max_attempts} failed; sleeping 30s before retry..."
              sleep 30
            fi
          done
          reconcile_attempts=20
          for reconcile_attempt in $(seq 1 "${reconcile_attempts}"); do
            if reconciled_attested; then
              echo "::notice::Version landed attested after the final reported error; treating as success."
              exit 0
            fi
            echo "Not yet visible on the registry; re-reading in 30s (${reconcile_attempt}/${reconcile_attempts})..."
            sleep 30
          done
          if reconciled_attested; then
            echo "::notice::Version landed attested at the end of the 10-minute visibility window; treating as success."
            exit 0
          fi
          refuse_unattested_or_fail
        working-directory: ${{ env.NPM_PROJECT_PATH }}
      - name: Install optional hook dependencies
        if: (steps.continue.outputs.action != 'complete' && inputs.publish-script != '') || inputs.post-release-script != ''
        working-directory: ${{ env.NPM_PROJECT_PATH }}
        run: npm ci --ignore-scripts
      - name: Publish extra targets
        id: extra_publish
        if: steps.continue.outputs.action != 'complete' && (!inputs.npm-publish || steps.publish.outcome == 'success')
        working-directory: ${{ env.NPM_PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PUBLISH_SCRIPT" ]]; then npm run "$PUBLISH_SCRIPT"; fi
      - name: Push release tag
        id: push_tag
        if: steps.continue.outputs.action != 'complete' && steps.extra_publish.outcome == 'success'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.reconcile.outputs.tag }}
        run: |
          set -euo pipefail
          release_tag="$RELEASE_TAG"
          git fetch origin --force --tags
          remote_tag_sha="$(git ls-remote --refs --tags origin "refs/tags/${release_tag}" | awk 'NR == 1 { print $1 }')"
          current_sha="$(git rev-parse HEAD)"
          if [[ -n "$remote_tag_sha" ]]; then
            remote_commit="$(git rev-list -n 1 "$remote_tag_sha")"
            if [[ "$remote_commit" != "$current_sha" ]]; then
              echo "::error::${release_tag} already exists on origin at ${remote_commit}, not verified main ${current_sha}."
              exit 1
            fi
            echo "::notice::${release_tag} is already on origin at the verified commit; nothing to push."
            exit 0
          fi
          if git rev-parse --verify --quiet "refs/tags/${release_tag}" > /dev/null; then
            existing_sha="$(git rev-list -n 1 "$release_tag")"
            current_sha="$(git rev-parse HEAD)"
            if [[ "$existing_sha" != "$current_sha" ]]; then
              echo "::error::${release_tag} already points to ${existing_sha}, not verified main ${current_sha}."
              exit 1
            fi
          else
            git tag "$release_tag"
          fi
          git push origin "refs/tags/${release_tag}"
      - name: Create GitHub release
        if: "!cancelled() && steps.push_tag.outcome == 'success' && steps.extra_publish.outcome == 'success'"
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          RELEASE_TAG: ${{ needs.reconcile.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$REPO_NAME $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-artifact/RELEASE_NOTES.md" --verify-tag
          fi
        id: github_release
        shell: bash
      - name: Post release hook
        id: post_hook
        if: "success() && (steps.github_release.outcome == 'success' || steps.continue.outputs.action == 'complete') && inputs.post-release-script != ''"
        working-directory: ${{ env.NPM_PROJECT_PATH }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.reconcile.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          node "$CONTINUATION_SCRIPT" post-hook
      - name: Clean up merged release branch
        if: "!cancelled() && steps.github_release.outcome == 'success'"
        shell: bash
        env:
          RELEASE_PR_NUMBER: ${{ needs.reconcile.outputs.pr_number }}
          EXPECTED_HEAD: ${{ needs.reconcile.outputs.headSha }}
        run: |
          set -euo pipefail
          node "$CONTINUATION_SCRIPT" verify >/dev/null
          release_branch="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER" --jq .head.ref)"
          [[ "$release_branch" =~ ^release/[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(-[0-9]+)?$ ]] || exit 1
          expected_sha="$EXPECTED_HEAD"
          git push --force-with-lease="refs/heads/${release_branch}:${expected_sha}" origin ":refs/heads/${release_branch}" || echo "::warning::Could not delete the verified merged release branch."
      - name: Complete durable release intent
        if: "!cancelled() && (steps.github_release.outcome == 'success' || steps.continue.outputs.action == 'complete') && (inputs.post-release-script == '' || steps.post_hook.outcome == 'success')"
        shell: bash
        run: node "$CONTINUATION_SCRIPT" complete
    needs: reconcile
    outputs:
      commit: ${{ needs.reconcile.outputs.merged_sha }}
      published: ${{ steps.push_tag.outcome }}
  audit:
    needs:
      - prepare
      - release
      - recover
      - verify_bun
      - reconcile
      - request
    if: "!cancelled() && inputs.audit-script != '' && inputs.release-enabled && github.ref == 'refs/heads/main' && (!inputs.reconcile-only || needs.release.result == 'success')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Use an npm that supports trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@11.21.0 --ignore-scripts --no-audit --no-fund
          active="$(npm --version)"
          [[ "$active" == "11.21.0" ]] || { echo "::error::Expected npm 11.21.0, got $active"; exit 1; }
          required="11.5.1"
          if [ "$(printf '%s\n%s\n' "$active" "$required" | sort -V | head -n 1)" != "$required" ]; then
            echo "::error::npm $active cannot exchange an OIDC token; $required or newer is required."
            exit 1
          fi
          echo "npm $active can exchange an OIDC token for a registry credential."
      - name: Audit release completeness
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_SCRIPT: ${{ inputs.audit-script }}
          NPM_PROJECT_DIR: ${{ inputs.npm-project-dir }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AUDIT_SCRIPT" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.:-]*$ ]]
          [[ -n "$NPM_PROJECT_DIR" && "$NPM_PROJECT_DIR" != /* && "$NPM_PROJECT_DIR" != *[$'\r\n:']* ]]
          case "/$NPM_PROJECT_DIR/" in */../*) exit 1 ;; esac
          project="$(realpath -e -- "$GITHUB_WORKSPACE/$NPM_PROJECT_DIR")"
          [[ "$project" == "$GITHUB_WORKSPACE" || "$project" == "$GITHUB_WORKSPACE/"* ]]
          cd "$project"
          npm ci --ignore-scripts
          npm run "$AUDIT_SCRIPT"
  alert:
    needs:
      - prepare
      - release
      - recover
      - verify_bun
      - audit
      - reconcile
      - request
    if: failure() && inputs.alert-script != '' && inputs.release-enabled && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Use an npm that supports trusted publishing
        id: npm_setup
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@11.21.0 --ignore-scripts --no-audit --no-fund
          active="$(npm --version)"
          [[ "$active" == "11.21.0" ]] || { echo "::error::Expected npm 11.21.0, got $active"; exit 1; }
          required="11.5.1"
          if [ "$(printf '%s\n%s\n' "$active" "$required" | sort -V | head -n 1)" != "$required" ]; then
            echo "::error::npm $active cannot exchange an OIDC token; $required or newer is required."
            exit 1
          fi
          echo "npm $active can exchange an OIDC token for a registry credential."
      - name: Report release failure
        if: ${{ !cancelled() }}
        env:
          NPM_READY: ${{ steps.npm_setup.outcome == 'success' }}
          GH_TOKEN: ${{ github.token }}
          ALERT_SCRIPT: ${{ inputs.alert-script }}
          NPM_PROJECT_DIR: ${{ inputs.npm-project-dir }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ALERT_SCRIPT" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.:-]*$ ]]
          [[ -n "$NPM_PROJECT_DIR" && "$NPM_PROJECT_DIR" != /* && "$NPM_PROJECT_DIR" != *[$'\r\n:']* ]]
          case "/$NPM_PROJECT_DIR/" in */../*) exit 1 ;; esac
          project="$(realpath -e -- "$GITHUB_WORKSPACE/$NPM_PROJECT_DIR")"
          [[ "$project" == "$GITHUB_WORKSPACE" || "$project" == "$GITHUB_WORKSPACE/"* ]]
          cd "$project"
          if [[ "$NPM_READY" == "true" ]]; then
            npm ci --ignore-scripts || echo "::warning::Alert dependency installation failed; attempting the configured script."
          else
            echo "::warning::Pinned npm setup failed; attempting the configured alert without installing dependencies."
          fi
          if npm run "$ALERT_SCRIPT"; then exit 0; fi
          echo "::warning::Configured alert failed; reporting without project dependencies."
          title="Daily release failed (run $GITHUB_RUN_ID)"
          # Deduplicate on the workflow-run identity, not the fallback title: the
          # configured alert's issue may use any title, and issues that reference the
          # failed run (the documented alert contract) already cover this failure.
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "in:title,body $GITHUB_RUN_ID" --json number | jq -r '.[].number')"
          if [[ -n "$existing" ]]; then exit 0; fi
          body="$(mktemp)"
          trap 'rm -f -- "$body"' EXIT
          printf 'The daily release failed and its configured alert script could not complete. Inspect the workflow run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$body"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
  recover:
    needs: prepare
    if: inputs.release-enabled && github.ref == 'refs/heads/main' && needs.prepare.outputs.recovery_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TIMEZONE: ${{ inputs.release-timezone }}
      NPM_PROJECT_DIR: ${{ inputs.npm-project-dir }}
      PREPARE_SCRIPT: ${{ inputs.prepare-script }}
      BUILD_SCRIPT: ${{ inputs.build-script }}
      VERIFY_SCRIPT: ${{ inputs.verify-script }}
      CHANGELOG_SCRIPT: ${{ inputs.changelog-script }}
      CHANGELOG_CHECK_SCRIPT: ${{ inputs.changelog-check-script }}
      NOTES_SCRIPT: ${{ inputs.notes-script }}
      PUBLISH_SCRIPT: ${{ inputs.publish-script }}
      POST_RELEASE_SCRIPT: ${{ inputs.post-release-script }}
      RELEASE_FILES: ${{ inputs.release-files }}
      BUNX_SCRIPT: ${{ inputs.bunx-script }}
      IS_RUST: ${{ inputs.rust }}
      DATABASE_URL: ${{ inputs.postgres && 'postgres://postgres:test@127.0.0.1:55433/pmwebtest' || '' }}
      JWT_SECRET: ${{ inputs.postgres && 'pm-web-test-jwt-secret-at-least-32-bytes' || '' }}
      VERSION_POLICY: ${{ inputs.version-policy }}
      RECOVERY_TAG: ${{ needs.prepare.outputs.recovery_tag }}
      EXPECTED_COMMIT: ${{ needs.prepare.outputs.base_sha }}
      CALLER_WORKFLOW: ${{ github.workflow_ref }}
      PM_OPS_VERSION: ${{ needs.prepare.outputs.ops_version }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Use an npm that supports trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@11.21.0 --ignore-scripts --no-audit --no-fund
          active="$(npm --version)"
          [[ "$active" == "11.21.0" ]] || { echo "::error::Expected npm 11.21.0, got $active"; exit 1; }
          required="11.5.1"
          if [ "$(printf '%s\n%s\n' "$active" "$required" | sort -V | head -n 1)" != "$required" ]; then
            echo "::error::npm $active cannot exchange an OIDC token; $required or newer is required."
            exit 1
          fi
          echo "npm $active can exchange an OIDC token for a registry credential."
      - name: Checkout existing tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.recovery_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout trusted continuation tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: unbraind/pm-ops
          ref: ${{ job.workflow_sha }}
          path: .pm-ops-release-tools
          persist-credentials: false
      - name: Locate trusted continuation tools
        shell: bash
        run: |
          set -euo pipefail
          mv "$GITHUB_WORKSPACE/.pm-ops-release-tools" "$RUNNER_TEMP/pm-ops-release-tools"
          printf 'CONTINUATION_SCRIPT=%s/pm-ops-release-tools/scripts/release-continuation.ts\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PROVENANCE_SCRIPT=%s/pm-ops-release-tools/scripts/verify-registry-provenance.ts\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Enforce continuation runtime floor
        shell: bash
        run: node "${CONTINUATION_SCRIPT%/scripts/*}/dist/continuation-runtime.js"
      - name: Install pinned release tools
        shell: bash
        run: node "$CONTINUATION_SCRIPT" tools
      - name: Validate package inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$NPM_PROJECT_DIR" && "$NPM_PROJECT_DIR" != /* && "$NPM_PROJECT_DIR" != *[$'\r\n:']* ]] || exit 1
          case "/$NPM_PROJECT_DIR/" in */../*) exit 1 ;; esac
          project="$(realpath -e -- "$GITHUB_WORKSPACE/$NPM_PROJECT_DIR")"
          [[ "$project" == "$GITHUB_WORKSPACE" || "$project" == "$GITHUB_WORKSPACE/"* ]] || exit 1
          [[ "$project" != *[$'\r\n:']* ]] || exit 1
          if [[ "$IS_RUST" == true ]]; then
            [[ -f "$project/Cargo.toml" ]]
          else
            [[ -f "$project/package.json" ]]
            [[ -n "$VERIFY_SCRIPT" && -n "$CHANGELOG_SCRIPT" && -n "$CHANGELOG_CHECK_SCRIPT" && -n "$NOTES_SCRIPT" ]]
          fi
          for script in "$PREPARE_SCRIPT" "$BUILD_SCRIPT" "$VERIFY_SCRIPT" "$CHANGELOG_SCRIPT" "$CHANGELOG_CHECK_SCRIPT" "$NOTES_SCRIPT" "$PUBLISH_SCRIPT" "$POST_RELEASE_SCRIPT" "$BUNX_SCRIPT"; do
            [[ -z "$script" || "$script" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.:-]*$ ]] || { echo '::error::Hooks must be npm script names.'; exit 1; }
          done
          printf 'NPM_PROJECT_PATH=%s\n' "$project" >> "$GITHUB_ENV"
      - name: Download recovery notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: daily-release-recovery-notes
          path: ${{ runner.temp }}
      - name: Repair missing GitHub Release
        shell: bash
        working-directory: ${{ env.NPM_PROJECT_PATH }}
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_PUBLISH: ${{ inputs.npm-publish }}
          PROVENANCE_RECOVERY: 'true'
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_COMMIT" ]]
          if gh release view "$RECOVERY_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          if [[ "$NPM_PUBLISH" == true ]]; then
            pkg_name="$(node -p "require('./package.json').name")"
            recovery_version="$(VERSION="${RECOVERY_TAG#v}" node -e 'const [core, suffix] = process.env.VERSION.split("-"); process.stdout.write(core.split(".").map(Number).join(".") + (suffix === undefined ? "" : "-" + Number(suffix)))')"
            metadata="$(npm view "$pkg_name@$recovery_version" dist --prefer-online --json)"
            attest_url="$(jq -r '.attestations.url // empty' <<< "$metadata")"
            [[ "$attest_url" == https://registry.npmjs.org/* ]]
            curl --fail --silent --show-error --max-time 30 "$attest_url" | \
              EXPECTED_INTEGRITY="$(jq -r '.integrity' <<< "$metadata")" node "$PROVENANCE_SCRIPT"
          fi
          gh release create "$RECOVERY_TAG" --repo "$GITHUB_REPOSITORY" --title "${GITHUB_REPOSITORY#*/} $RECOVERY_TAG" --notes-file "$RUNNER_TEMP/recovery-notes.md" --verify-tag
  verify_bun:
    needs:
      - reconcile
      - release
    if: inputs.release-enabled && github.ref == 'refs/heads/main' && inputs.npm-publish && inputs.bun-verify && needs.release.outputs.published == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.release.outputs.commit }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Verify bun install of published package
        id: verify_bun
        env:
          NPM_VERSION: ${{ needs.reconcile.outputs.version }}
          PKG_NAME: ${{ needs.reconcile.outputs.packageName }}
          CLI_VERSION: ${{ needs.reconcile.outputs.cliVersion }}
          BUNX_SCRIPT: ${{ inputs.bunx-script }}
          NPM_PROJECT_DIR: ${{ inputs.npm-project-dir }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLI_VERSION" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]
          pkg_name="$PKG_NAME"
          pkg_version="${NPM_VERSION}"
          verify_dir="$(mktemp -d "$RUNNER_TEMP/bun-verify.XXXXXX")"
          cd "$verify_dir"
          bun init -y > /dev/null
          bun_attempts=21
          verified=false
          for attempt in $(seq 1 "${bun_attempts}"); do
            # Bun caches a negative manifest on a miss; reusing that cache made every retry vacuous
            # and once left tagged releases without a GitHub Release for 14 days (see release.yml).
            # A fresh cache per attempt forces a registry query; `bun pm cache rm` covers bun
            # versions that ignore BUN_INSTALL_CACHE_DIR.
            export BUN_INSTALL_CACHE_DIR="$(mktemp -d "$RUNNER_TEMP/bun-cache.XXXXXX")"
            bun pm cache rm > /dev/null 2>&1 || true
            if bun add --ignore-scripts "${pkg_name}@${pkg_version}"; then
              bun add --dev --ignore-scripts "@unbrained/pm-cli@$CLI_VERSION"
              export PM_PATH="$verify_dir/.agents/pm" PM_GLOBAL_PATH="$verify_dir/global"
              bunx --bun --no-install pm init --defaults --agent-guidance skip --prefix release --json
              bunx --bun --no-install pm package install "./node_modules/$pkg_name" --project
              bunx --bun --no-install pm health --strict-exit --json
              printf 'PM_PATH=%s\nPM_GLOBAL_PATH=%s\nBUN_INSTALL_CACHE_DIR=%s\n' "$PM_PATH" "$PM_GLOBAL_PATH" "$BUN_INSTALL_CACHE_DIR" >> "$GITHUB_ENV"
              echo "bun add succeeded on attempt $attempt"
              verified=true
              break
            fi
            if (( attempt < bun_attempts )); then
              echo "bun add failed on attempt $attempt, sleeping 30s..."
              sleep 30
            fi
          done
          [[ "$verified" == true ]] && exit 0
          echo "::error::bun could not resolve ${pkg_name}@${pkg_version} after ${bun_attempts} attempts across a 10-minute window. npm accepted the publish and the GitHub release is created regardless of this step; this failure keeps the bun mirror problem visible instead of silent."
          exit 1
      - name: Use an npm that supports trusted publishing
        if: inputs.bunx-script != '' && steps.verify_bun.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@11.21.0 --ignore-scripts --no-audit --no-fund
          active="$(npm --version)"
          [[ "$active" == "11.21.0" ]] || { echo "::error::Expected npm 11.21.0, got $active"; exit 1; }
          required="11.5.1"
          if [ "$(printf '%s\n%s\n' "$active" "$required" | sort -V | head -n 1)" != "$required" ]; then
            echo "::error::npm $active cannot exchange an OIDC token; $required or newer is required."
            exit 1
          fi
          echo "npm $active can exchange an OIDC token for a registry credential."
      - name: Run optional caller bunx acceptance
        if: inputs.bunx-script != '' && steps.verify_bun.outcome == 'success'
        env:
          BUNX_SCRIPT: ${{ inputs.bunx-script }}
          NPM_PROJECT_DIR: ${{ inputs.npm-project-dir }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUNX_SCRIPT" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.:-]*$ ]]
          [[ -n "$NPM_PROJECT_DIR" && "$NPM_PROJECT_DIR" != /* && "$NPM_PROJECT_DIR" != *[$'\r\n:']* ]]
          case "/$NPM_PROJECT_DIR/" in */../*) exit 1 ;; esac
          project="$(realpath -e -- "$GITHUB_WORKSPACE/$NPM_PROJECT_DIR")"
          [[ "$project" == "$GITHUB_WORKSPACE" || "$project" == "$GITHUB_WORKSPACE/"* ]]
          cd "$project"
          npm ci --ignore-scripts
          npm run "$BUNX_SCRIPT"
      - name: Fail the job on bun verification failure
        if: "!cancelled() && steps.verify_bun.outcome == 'failure'"
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::bun install verification failed (see the step log above); the npm publish, the tag push and the GitHub release were not affected. Failing the job so the bun mirror problem is not silent."
          exit 1
