version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    ignore:
      # sigstore 5 requires Node >=22.22.2 through @npmcli/agent;
      # pm-ops supports Node >=22.18.0.
      - dependency-name: "sigstore"
        update-types: ["version-update:semver-major"]
    groups:
      # The pm CLI, its SDK-bearing packages and the fleet gates move together
      # in one pull request per day; dependabot-auto-merge.yml merges it as soon
      # as the required checks pass, so a release bump needs no manual work.
      # No update-types filter: pm uses calendar versions, so a year rollover
      # (2026.x -> 2027.x) is a semver major that must still land unattended.
      pm-toolchain:
        patterns:
          - "@unbrained/pm-cli"
          - "pm-*"
      dependencies:
        # Every other npm dependency, disjoint from pm-toolchain, so a pm
        # package can never be bumped here (and capped by update-types).
        patterns:
          - "*"
        exclude-patterns:
          - "@unbrained/pm-cli"
          - "pm-*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/.github/release-runtime"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 2
    ignore:
      # sigstore 5 excludes the supported Node >=22.18.0 runtime floor.
      - dependency-name: "sigstore"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # `github/codeql-action/init` and `github/codeql-action/analyze` are
      # separate dependency names that must run at the same version. Ungrouped
      # they arrive as two independent pull requests and each fails alone on
      # the version mismatch, with nothing in either indicating they must land
      # together. The wildcard form (used by 18 of 22 fleet repos on
      # 2026-09-06) matches both sub-actions in one update.
      codeql-actions:
        patterns:
          - "github/codeql-action*"
      # Every pm-github workflow caller in this repository moves in one pull request, on one reviewed release.
      pm-github-workflows:
        patterns:
          - "unbraind/pm-github/*"
