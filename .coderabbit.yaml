reviews:
  path_instructions:
    - path: "attestation.ts"
      instructions: &release_hook_scope >-
        Release hooks are authored by repository owners.
        Attestation guards against drift and honest misconfiguration across release steps.
        Hostile workflow authors already control release execution and are outside this threat model.
        Require the pinned fleet scan to continue accepting all 142 release hooks and 144 script bodies from 39 manifests.
        Package hooks use direct pm-changelog, Node adapters and custom renderers, npm forwards and Just recipes,
        quoted words, inline and separate option operands, option-position delimiters and pm-arg passthrough.
        The Git bookkeeping posthook uses tests, if/then/fi, subshells, stdout and descriptor redirects, and &&/|| lists.
        The pinned workflow bodies also contain loops with break/continue, case arms, here-documents and here-strings,
        GITHUB_ENV writes, pipelines and exit. Preserve the supported workflow forms and prior hook acceptance fixtures.
        Case patterns belong to workflow syntax. The hook grammar refuses case arms and unquoted command negation.
        time, npm's implicit env, and changelog paths that are not plain single-link files below real directories
        are refused lexically by design; do not propose modelling them. Check command-position time across the whole
        participating release or publish step. Quoted time and argument data are supported.
        None of the 144 hook bodies logs with printf or uses cat. Both commands are refused in package release hooks.
        Use release_hook_unsupported_construct for those shell forms and for a missing optional sole renderer.
        Directory or file links and ambiguous receipt destinations receive a path and reason before writes.
        Refuse jobs.<id>.container on a release path.
        Preserve physical edits across expandable here-document and case terminator continuations.
        Join executable continuations while preserving single-quoted data and comment boundaries.
        Require literal custom renderer option names. Refuse dynamic names with release_hook_unsupported_construct.
        A known option can take a dynamic or option-shaped value, including a title.
        Classify shell assignments from the unquoted name and operator. The env utility uses decoded NAME=value operands.
        Use the shared diagnostic for unsupported shell modes, including set -f and changes to shell builtins.
        A workflow using sh cannot establish a definite environment export after setting pipefail.
        Validate pipefail against the npm-selected shell before preparing or consuming a configured hook.
        Follow a declared env script normally, and ignore unrelated diagnostic steps in the date audit.
        A trailing loop can succeed with zero iterations, including after a failed AND-list.
        Refuse release paths through intermediate relays in container jobs. Keep unrelated relays supported.
        Enabled reusable callers require a literal, existing nonblank root script for each explicit hook selector.
        Refuse new constructs outside the supported forms with release_hook_unsupported_construct,
        naming the construct and hook and advising a simpler hook or a separate script file.
    - path: "release-shell-constructs.ts"
      instructions: *release_hook_scope
    - path: "shell-scan.ts"
      instructions: *release_hook_scope
    - path: "release-hook-grammar.ts"
      instructions: *release_hook_scope
    - path: "release-changelog-options.ts"
      instructions: *release_hook_scope
    - path: "scripts/**"
      instructions: *release_hook_scope
